plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load signing credentials from keystore.properties (generated by CI or provided locally).
// If the file is absent the release build stays unsigned, which is fine for debug/local builds.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Version is injected by CI from the release tag (vX.Y.Z) when RELEASE_VERSION_*
// is set (see .github/workflows/build-release.yml). Local builds fall back to the
// hardcoded defaults below, so keep them in sync with the last released tag.
def releaseVersionName = System.getenv("RELEASE_VERSION_NAME") ?: "1.0.5"
def releaseVersionCode = (System.getenv("RELEASE_VERSION_CODE") ?: "5").toInteger()

android {
    namespace 'com.yxliu.keepalive'
    compileSdk 34

    defaultConfig {
        applicationId "com.yxliu.keepalive"
        minSdk 26
        targetSdk 34
        versionCode releaseVersionCode
        versionName releaseVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
}
